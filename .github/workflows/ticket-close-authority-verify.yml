name: Ticket Close Authority Verification
on:
  push:
    branches:
      - fix/support-close-single-authority-20261112
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q bot.py handlers support_service.py
      - run: timeout 330s python -m pytest -q
