name: Verify Journald Startup Logging

on:
  push:
    branches:
      - fix/journald-no-tracked-log-permission-20261112
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q bot.py handlers
      - run: timeout 300s python -m pytest -q
