name: Verify Rebecca Smart User Alerts

on:
  push:
    branches:
      - feature/rebecca-smart-user-quota-alerts-20261112
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q bot.py handlers scheduler.py message_catalog.py rebecca_user_alerts.py tests
      - run: timeout 330s python -m pytest -q
      - run: git diff --check
