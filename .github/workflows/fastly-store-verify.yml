name: Verify Fastly Digital Store

on:
  push:
    branches:
      - feat/fastly-digital-store-20261127
  pull_request:
    branches:
      - fix/kyc-empty-message-20261026
  workflow_dispatch:

jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q bot.py handlers fastly_store_service.py message_catalog.py tests
      - name: Fastly isolated tests
        run: python -m pytest -q tests/test_fastly_store.py tests/test_fastly_navigation.py
      - name: Wingmarz full regression suite
        run: timeout 400s python -m pytest -q
      - name: Git whitespace check
        run: git diff --check
