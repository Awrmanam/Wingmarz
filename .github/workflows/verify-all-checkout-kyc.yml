name: Verify One KYC Gate Before Every Payment

on:
  push:
    branches:
      - fix/kyc-all-payment-entrypoints-20261112
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q bot.py handlers purchase_kyc_flow.py
      - name: All Wingmarz regression tests
        run: timeout 330s python -m pytest -q
      - name: Patch whitespace
        run: git diff --check
