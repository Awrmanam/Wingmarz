name: Trial UI V2 Verify

on:
  push:
    branches: ["feature/trial-ui-v2"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: pytest -q
      - name: Diff check
        run: git diff --check
