name: Wingmarz Unified Management Safety Verification

on:
  push:
    branches:
      - feat/unified-management-ux-20261113
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wingmarz-unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile source and tests
        run: python -m compileall -q bot.py handlers payg_service.py rebecca_user_alerts.py scheduler.py tests
      - name: Run full test suite
        run: timeout 600s python -m pytest -q
      - name: Git whitespace validation
        run: git diff --check
