version: '3.8'

services:
  marzban-admin-bot:
    build: .
    container_name: marzban-admin-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - MARZBAN_URL=${MARZBAN_URL}
      - MARZBAN_USERNAME=${MARZBAN_USERNAME}
      - MARZBAN_PASSWORD=${MARZBAN_PASSWORD}
      - PANEL_PROVIDER=${PANEL_PROVIDER:-marzban}
      - REBECCA_URL=${REBECCA_URL:-}
      - REBECCA_BEARER_TOKEN=${REBECCA_BEARER_TOKEN:-}
      - REBECCA_LOGIN_URL=${REBECCA_LOGIN_URL:-}
      - REBECCA_SERVICE_IDS=${REBECCA_SERVICE_IDS:-}
      - SUDO_ADMINS=${SUDO_ADMINS}
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-600}
      - WARNING_THRESHOLD=${WARNING_THRESHOLD:-0.8}
      - DATABASE_PATH=/app/data/bot_database.db
      - BACKUP_DIR=/app/data/backups
      - BACKUP_AUTO_ENABLED=${BACKUP_AUTO_ENABLED:-true}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-1}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-24}
      - BACKUP_ZIP_PASSWORD=${BACKUP_ZIP_PASSWORD:-}
      - BACKUP_INCLUDE_LOGS=${BACKUP_INCLUDE_LOGS:-true}
      - BACKUP_RECIPIENTS=${BACKUP_RECIPIENTS:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
